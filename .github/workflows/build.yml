# Сборка приложения для macOS и Windows и загрузка архивов в релиз GitHub.
# Запускается сама при публикации релиза; вручную — Actions → «Сборка приложения» → Run workflow с тегом релиза.
name: Сборка приложения

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить сборки (например 3.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
          - os: macos-15-intel    # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости
        run: python -m pip install -r config/requirements-build.txt

      - name: Сборка
        run: python packaging/build.py --version "${{ env.TAG }}"

      # Сборка запускает свои скрипты сама собой — проверяем, что скрипт выполняется и вывод доходит до родителя.
      - name: Проверка (macOS)
        if: runner.os == 'macOS'
        run: |
          out=$(dist/OzonReportX.app/Contents/MacOS/OzonReportX dist/OzonReportX.app/Contents/Frameworks/scripts/_auto_update.py)
          echo "$out"
          echo "$out" | grep -q "Текущая версия: ${TAG}"

      - name: Проверка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $out = & dist\OzonReportX\OzonReportX.exe dist\OzonReportX\_internal\scripts\_auto_update.py | Out-String
          Write-Output $out
          if ($out -notmatch "Текущая версия: $env:TAG") { exit 1 }

      - name: Загрузка в релиз
        shell: bash
        run: gh release upload "$TAG" dist/*.zip --clobber
